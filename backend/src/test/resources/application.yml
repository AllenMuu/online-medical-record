spring:
  datasource:
    url: jdbc:h2:mem:medical_record;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  sql:
    init:
      mode: never

app:
  cors:
    allowed-origins: http://localhost:5173
